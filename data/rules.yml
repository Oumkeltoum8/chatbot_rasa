version: "3.1"

rules:

- rule: Répondre au salut
  steps:
  - intent: saluer
  - action: utter_saluer

- rule: Répondre à l'au revoir
  steps:
  - intent: au_revoir
  - action: utter_au_revoir

- rule: Répondre aux remerciements
  steps:
  - intent: remercier
  - action: utter_remercier

- rule: Donner les chapitres d'un module
  steps:
  - intent: demander_chapitres_module
  - action: utter_chapitres_module

- rule: Donner l'emploi du temps
  steps:
  - intent: demander_emploi_du_temps
  - action: utter_emploi_du_temps

- rule: Donner l'enseignant d'un module
  steps:
  - intent: demander_enseignant_module
  - action: utter_enseignant_module

- rule: Donner les horaires de la bibliothèque
  steps:
  - intent: demander_horaires_bibliotheque
  - action: utter_horaires_bibliotheque

- rule: Donner la procédure d'attestation de scolarité
  steps:
  - intent: demander_attestation_scolarite
  - action: utter_attestation_scolarite

- rule: Donner les infos sur la bourse
  steps:
  - intent: demander_info_bourse
  - action: utter_info_bourse

- rule: Donner le calendrier des examens
  steps:
  - intent: demander_calendrier_examens
  - action: utter_calendrier_examens

- rule: Donner le contact de l'administration
  steps:
  - intent: demander_contact_administration
  - action: utter_contact_administration

- rule: Gérer les messages incompris
  steps:
  - intent: nlu_fallback
  - action: utter_default

- rule: Gérer les questions hors-sujet
  steps:
  - intent: out_of_scope
  - action: utter_out_of_scope  
