<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>UniBot - Assistant Universitaire</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .chat-container {
    width: 420px;
    height: 600px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .chat-header {
    background: #1d3a7a;
    color: white;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .chat-header .avatar {
    width: 38px; height: 38px;
    background: white;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .chat-header h2 { font-size: 16px; margin-bottom: 2px; }
  .chat-header p { font-size: 12px; color: #a8bde0; }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.5;
    word-wrap: break-word;
  }
  .msg.bot {
    background: #f0f4ff;
    color: #1f2937;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .msg.user {
    background: #1d3a7a;
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .typing {
    font-size: 12px;
    color: #9ca3af;
    align-self: flex-start;
    padding: 4px 8px;
  }
  .chat-input {
    padding: 14px 16px;
    border-top: 1px solid #e5e7eb;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .chat-input input {
    flex: 1;
    border: 1px solid #d1d5db;
    border-radius: 24px;
    padding: 10px 16px;
    font-size: 14px;
    outline: none;
    transition: border 0.2s;
  }
  .chat-input input:focus { border-color: #1d3a7a; }
  .chat-input button {
    background: #1d3a7a;
    color: white;
    border: none;
    border-radius: 50%;
    width: 40px; height: 40px;
    cursor: pointer;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .chat-input button:hover { background: #0a1f44; }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <div class="avatar">🎓</div>
    <div>
      <h2>UniBot</h2>
      <p>Assistant universitaire</p>
    </div>
  </div>

  <div class="chat-messages" id="messages">
    <div class="msg bot">Bonjour ! Je suis UniBot, votre assistant universitaire. Comment puis-je vous aider aujourd'hui ?</div>
  </div>

  <div class="chat-input">
    <input type="text" id="userInput" placeholder="Tapez votre message..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
  const RASA_URL = "http://localhost:5005/webhooks/rest/webhook";
  const messagesDiv = document.getElementById("messages");
  const userInput = document.getElementById("userInput");

  function addMessage(text, sender) {
    const msg = document.createElement("div");
    msg.className = "msg " + sender;
    msg.textContent = text;
    messagesDiv.appendChild(msg);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function showTyping() {
    const typing = document.createElement("div");
    typing.className = "typing";
    typing.id = "typing";
    typing.textContent = "UniBot est en train d'écrire...";
    messagesDiv.appendChild(typing);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function hideTyping() {
    const typing = document.getElementById("typing");
    if (typing) typing.remove();
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;
    userInput.value = "";
    addMessage(text, "user");
    showTyping();
    try {
      const response = await fetch(RASA_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sender: "user1", message: text })
      });
      const data = await response.json();
      hideTyping();
      if (data && data.length > 0) {
        data.forEach(msg => {
          if (msg.text) addMessage(msg.text, "bot");
        });
      } else {
        addMessage("Désolé, je n'ai pas pu traiter votre message.", "bot");
      }
    } catch (error) {
      hideTyping();
      addMessage("Erreur de connexion au serveur. Vérifiez que Rasa est bien lancé.", "bot");
      console.error("Erreur:", error);
    }
  }
</script>

</body>
</html>
